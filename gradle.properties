# R8 full-mode shrinking needs substantially more heap than the previous 2GB;
# with onnxruntime + WebRTC + Compose + Vosk the shrinker was thrashing.
android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

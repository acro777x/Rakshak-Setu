name: Build & Release Split APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Split APKs
        run: ./gradlew clean assembleDebug

      - name: Stage APK Artifacts
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release_apk/RakshakSetu-v1.2.0-arm64-v8a.apk || true
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk release_apk/RakshakSetu-v1.2.0-armeabi-v7a.apk || true

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_apk/RakshakSetu-v1.2.0-arm64-v8a.apk
            release_apk/RakshakSetu-v1.2.0-armeabi-v7a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
